syntax = "proto3";
package plugin.keystore.management.v1;

import "google/protobuf/struct.proto";
import "plugin/keystore/common/v1/common.proto";

service KeystoreProvider {
  rpc CreateKeystore(CreateKeystoreRequest) returns (CreateKeystoreResponse);
  rpc DeleteKeystore(DeleteKeystoreRequest) returns (DeleteKeystoreResponse);
  rpc GetKeystoreStatus(GetKeystoreStatusRequest) returns (GetKeystoreStatusResponse);
}

message CreateKeystoreRequest {
  google.protobuf.Struct values = 1;
}

message CreateKeystoreResponse {
  plugin.keystore.common.v1.KeystoreInstanceConfig config = 1;

  // Status of keystore creation
  // Values: "ACTIVE" (default, immediately ready), "PENDING_ACTIVATION" (account created, waiting for activation), "FAILED" (creation failed)
  // If not set or empty, defaults to "ACTIVE" for backwards compatibility
  string status = 2;

  // Hyperscaler account ID for tracking pending keystores
  // Required when status is "PENDING_ACTIVATION"
  // Used to poll activation status via GetKeystoreStatus
  string hyperscaler_account_id = 3;

  // Error message when status is "FAILED"
  // Provides details about what went wrong during creation
  string error_message = 4;
}

message GetKeystoreStatusRequest {
  // Hyperscaler account ID returned from CreateKeystore when status was PENDING_ACTIVATION
  string hyperscaler_account_id = 1;
}

message GetKeystoreStatusResponse {
  // Current status: "PENDING_ACTIVATION", "ACTIVE", or "FAILED"
  string status = 1;

  // Full keystore configuration, only populated when status is "ACTIVE"
  // Contains all necessary information to use the keystore
  plugin.keystore.common.v1.KeystoreInstanceConfig config = 2;

  // Error message when status is "FAILED"
  string error_message = 3;
}

message DeleteKeystoreRequest {
  plugin.keystore.common.v1.KeystoreInstanceConfig config = 1;
}

message DeleteKeystoreResponse {}
